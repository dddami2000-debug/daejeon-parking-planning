<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>대전갈까? · 랜드마크 데이터 보강</title>
    <style>
      :root{font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR",sans-serif;color:#173a2a;background:#eff6ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:#fff;border:1px solid #d9e8dc;border-radius:24px;padding:28px;box-shadow:0 20px 55px #173a2a18}h1{font-size:23px;margin:0 0 8px}.eyebrow{color:#3d8360;font-size:12px;font-weight:800;margin-bottom:8px}p{color:#62736a;font-size:14px;line-height:1.6}label{display:block;font-size:13px;font-weight:800;margin:20px 0 7px}input,select,button{width:100%;min-height:46px;border-radius:12px;font:inherit}input,select{border:1px solid #cfe0d2;padding:0 12px;background:#fff}button{border:0;background:#195a3d;color:#fff;font-weight:800;margin-top:18px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.notice{padding:12px;border-radius:12px;background:#fff8dd;color:#735c19;font-size:12px;line-height:1.55}.result{display:none;white-space:pre-wrap;word-break:break-word;margin-top:16px;padding:12px;border-radius:12px;background:#f2f7f3;color:#325443;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace}.result.show{display:block}.result.error{background:#fff0ee;color:#9e4139}
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">ADMIN · ONE-TIME SYNC</p>
      <h1>랜드마크 정보 보강</h1>
      <p>공식 출처를 검색해 사진과 방문 안내를 Supabase에 저장합니다.</p>
      <p class="notice">토큰은 이 브라우저 메모리에서 요청을 인증할 때만 쓰며, 저장하지 않습니다. 실행 후 탭을 닫아주세요.</p>
      <form id="syncForm">
        <label for="token">ENRICH_ADMIN_TOKEN</label>
        <input id="token" type="password" autocomplete="off" required />
        <label for="limit">실행 방식</label>
        <select id="limit"><option value="auto">전체 자동 보강 (4개씩)</option><option value="4">이번 4개만</option><option value="2">이번 2개만</option><option value="1">이번 1개만</option></select>
        <button id="submitButton" type="submit">공식 정보 보강 시작</button>
      </form>
      <pre class="result" id="result" aria-live="polite"></pre>
    </main>
    <script>
      const form=document.querySelector('#syncForm');const token=document.querySelector('#token');const limit=document.querySelector('#limit');const button=document.querySelector('#submitButton');const result=document.querySelector('#result');
      const pause=(ms)=>new Promise((resolve)=>setTimeout(resolve,ms));
      async function enrichBatch(batchSize,secret){const response=await fetch(`/api/enrich-landmarks?limit=${encodeURIComponent(batchSize)}`,{method:'POST',headers:{Authorization:`Bearer ${secret}`}});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||`HTTP ${response.status}`);return payload;}
      form.addEventListener('submit',async(event)=>{event.preventDefault();const secret=token.value;const automatic=limit.value==='auto';button.disabled=true;limit.disabled=true;button.textContent=automatic?'전체 자동 보강 중…':'공식 정보 검색 중…';result.className='result show';let completed=0;let lastPayload=null;try{do{result.textContent=automatic?`랜드마크 ${completed}개 처리 완료. 다음 4개를 공식 출처로 확인 중이에요…\n탭을 닫지 말아주세요.`:'요청을 시작했어요. 최대 1분 정도 걸릴 수 있어요.';lastPayload=await enrichBatch(automatic?4:limit.value,secret);completed+=lastPayload.updated||0;if(!automatic)break;if((lastPayload.requested||0)===0||(lastPayload.remaining||0)===0)break;if((lastPayload.updated||0)<(lastPayload.requested||0))throw new Error('일부 항목 보강에 실패해 자동 실행을 멈췄어요. 결과를 확인한 뒤 다시 실행해 주세요.');await pause(350);}while(true);result.textContent=automatic?`전체 자동 보강 완료: ${completed}개 저장\n\n${JSON.stringify(lastPayload,null,2)}`:JSON.stringify(lastPayload,null,2);token.value='';}catch(error){result.textContent=`${automatic?`자동 보강 중 ${completed}개 저장\n\n`:''}요청 실패: ${error.message}`;result.className='result show error';}finally{button.disabled=false;limit.disabled=false;button.textContent='공식 정보 보강 시작';}});
    </script>
  </body>
</html>
